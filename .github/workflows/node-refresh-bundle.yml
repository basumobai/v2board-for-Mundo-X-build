name: Generate node interaction bundle
on:
  push:
    branches:
      - codex/fix-node-create-tablet-ui-20261002
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify the reviewed bundle patch
        run: |
          git apply --check scripts/node-creation-bundle.patch
          git apply scripts/node-creation-bundle.patch
          test "$(git hash-object public/assets/admin/umi.js)" = "8ebfe90f42cd6c8393fb458e597516931f2da403"
          node --check public/assets/admin/umi.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/admin/umi.js
          git commit -m "Avoid blocking node refresh behind an earlier HTTP request"
          git push origin HEAD:codex/fix-node-create-tablet-ui-20261002
