server {
    listen 127.0.0.1:${GATEWAY_PORT};
    server_name _;

    root /www/public;
    client_max_body_size 32m;

    # The admin application bundle is several megabytes uncompressed. A cold
    # cache must not leave the server-rendered shell visible for minutes on a
    # slow connection while the browser waits for JavaScript before mounting.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:${WEB_PORT};
    }

    location = /paytaro-qr/pay.php {
        proxy_pass http://127.0.0.1:${WEB_PORT};
        include /etc/nginx/v2board-proxy-headers.inc;
    }

    location = / {
        proxy_pass http://127.0.0.1:${WEB_PORT};
        include /etc/nginx/v2board-proxy-headers.inc;
    }

    location / {
        try_files $uri @v2board;
    }

    location @v2board {
        proxy_pass http://127.0.0.1:${WEB_PORT};
        include /etc/nginx/v2board-proxy-headers.inc;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|map)$ {
        try_files $uri @v2board;
        expires 7d;
        access_log off;
    }
}
