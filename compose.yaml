x-v2board-image: &v2board-image
  image: mundo-v2board-local:latest

x-v2board-service: &v2board-service
  <<: *v2board-image
  working_dir: /www
  volumes:
    - redis-data:/data
    - ./:/www
  environment:
    docker: "true"
  depends_on:
    redis:
      condition: service_healthy
  network_mode: host
  restart: unless-stopped

services:
  web:
    <<: *v2board-service
    build:
      context: .
      dockerfile: Dockerfile
    command: php -c cli-php.ini webman.php start
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$socket = @fsockopen("127.0.0.1", 6600); exit($socket ? 0 : 1);'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  gateway:
    image: nginx:stable-alpine
    network_mode: host
    volumes:
      - ./:/www:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/v2board-proxy-headers.inc:/etc/nginx/v2board-proxy-headers.inc:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *v2board-service
    command: php artisan horizon

  scheduler:
    <<: *v2board-service
    command:
      - sh
      - -lc
      - |
        while true; do
          php artisan schedule:run --no-interaction
          sleep 60
        done

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "0"
      - --unixsocket
      - /data/redis.sock
      - --unixsocketperm
      - "777"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-s", "/data/redis.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    sysctls:
      net.core.somaxconn: 1024
    restart: unless-stopped

volumes:
  redis-data:
